<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Mathijs.ai | Account aanmaken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #F5C518;
        --accent-dark: #D4A915;
        --hero-1: #0D1840;
        --hero-2: #12122A;
        --hero-3: #2D2D50;
        --fg: #1a1a1f;
        --fg-muted: #6b6b76;
        --border: rgba(0, 0, 0, 0.08);
        --error: #dc3545;
        --success: #28a745;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 560px at 22% 12%, rgba(245, 197, 24, 0.18) 0%, rgba(245, 197, 24, 0.08) 28%, transparent 62%),
          radial-gradient(900px 420px at 78% 14%, rgba(245, 197, 24, 0.08) 0%, transparent 58%),
          linear-gradient(180deg, var(--hero-1) 0%, var(--hero-1) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(circle at 22% 24%, rgba(245, 197, 24, 0.06) 0%, transparent 48%),
          url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='50' cy='50' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        opacity: 0.9;
        pointer-events: none;
      }

      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(920px 560px at 82% 82%, rgba(245, 197, 24, 0.08) 0%, transparent 68%),
          radial-gradient(1200px 560px at 14% 96%, rgba(13, 24, 64, 0.32) 0%, transparent 70%);
        pointer-events: none;
        opacity: 0.85;
      }

      .auth-container {
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 1;
      }

      .auth-card {
        background: #fff;
        border-radius: 24px;
        padding: 48px 40px;
        box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.4);
        position: relative;
      }

      .auth-headline {
        text-align: center;
        margin-bottom: 32px;
      }

      .auth-eyebrow {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        margin: 0 0 12px;
      }

      .auth-headline h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 12px;
        color: var(--fg);
      }

      .auth-subtitle {
        font-size: 0.95rem;
        color: var(--fg-muted);
        margin: 0;
        line-height: 1.5;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

	      .form-group {
	        display: flex;
	        flex-direction: column;
	        gap: 8px;
	      }
	      
	      .hp-field {
	        position: absolute;
	        left: -10000px;
	        top: auto;
	        width: 1px;
	        height: 1px;
	        overflow: hidden;
	      }

      .auth-form label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--fg);
      }

      .auth-form input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--fg);
        background: #fafafa;
        transition: all 0.2s ease;
      }

      .auth-form input::placeholder {
        color: #a0a0a8;
      }

      .auth-form input:focus {
        outline: none;
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(245, 197, 24, 0.15);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
        width: 100%;
      }

      .btn.primary {
        background: var(--accent);
        color: #1a1600;
      }

      .btn.primary:hover {
        background: var(--accent-dark);
        transform: translateY(-2px);
      }

      .btn.primary:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .form-feedback {
        min-height: 20px;
        font-size: 0.85rem;
        text-align: center;
        margin: 8px 0 0;
      }

      .form-feedback.error {
        color: var(--error);
      }

      .form-feedback.success {
        color: var(--success);
      }

      .auth-meta {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
        font-size: 0.9rem;
        color: var(--fg-muted);
      }

      .auth-meta a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .auth-meta a:hover {
        color: var(--accent-dark);
      }

      .back-arrow {
        position: absolute;
        top: 18px;
        left: 18px;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: var(--hero-3);
        background: transparent;
        border: 1px solid transparent;
        text-decoration: none;
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .back-arrow:hover {
        color: #0b2a4d;
        transform: translateY(-0.5px);
      }

      .back-arrow:active {
        transform: translateY(0);
      }

      .back-arrow:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(45, 45, 80, 0.22);
      }

      .back-arrow svg {
        width: 28px;
        height: 28px;
      }

      @media (max-width: 480px) {
        body {
          padding: calc(60px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
        }

        .auth-card {
          padding: 36px 24px;
          border-radius: 20px;
        }

        .auth-headline h1 {
          font-size: 1.3rem;
        }

        .auth-form input {
          font-size: 16px;
        }
      }

      @media (max-width: 380px) {
        .auth-card {
          padding: 30px 18px;
          border-radius: 18px;
        }

        .auth-headline h1 {
          font-size: 1.24rem;
        }

        .auth-subtitle {
          font-size: 0.88rem;
        }

        .btn {
          padding: 13px 18px;
          font-size: 0.9rem;
        }
      }
    </style>
      <link rel="stylesheet" href="assets/stability.css" />
    <script src="assets/stability.js" defer></script>
</head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <a href="/" class="back-arrow" aria-label="Terug naar home" title="Terug naar home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 8l-4 4 4 4" />
            <path d="M6 12h10" />
          </svg>
        </a>
        <div class="auth-headline">
          <p class="auth-eyebrow">Aan de slag</p>
          <h1>Maak een account aan</h1>
          <p class="auth-subtitle">
            Vul je gegevens in om een account te registreren. Daarna kun je direct doorgaan naar betaling.
          </p>
        </div>
	        <form id="signup-form" class="auth-form" novalidate>
	          <div class="hp-field" aria-hidden="true">
	            <label for="company-website">Website</label>
	            <input id="company-website" name="company_website" type="text" tabindex="-1" autocomplete="off" />
	          </div>
	          <div class="form-group">
	            <label for="signup-email">E-mailadres</label>
	            <input id="signup-email" name="email" type="email" placeholder="naam@bedrijf.com" required />
	          </div>

	          <div class="form-group">
	            <label for="signup-password">Wachtwoord</label>
	            <input id="signup-password" name="password" type="password" placeholder="••••••••••" required minlength="10" />
	          </div>

          <div class="form-group">
            <label for="signup-confirm">Herhaal wachtwoord</label>
            <input
              id="signup-confirm"
              name="confirm-password"
              type="password"
	              placeholder="••••••••"
	              required
	              minlength="10"
	            />
	          </div>

          <button type="submit" id="signup-submit" class="btn primary">Account aanmaken</button>
        </form>
        <p class="form-feedback" id="signup-feedback" aria-live="polite"></p>
      </div>
    </div>
    <script defer src="assets/vendor/supabase.min.js"></script>
    <script defer src="auth.js"></script>
  </body>
</html>
