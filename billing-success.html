<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Mathijs.ai | Betaling gelukt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #F5C518;
        --hero-1: #0D1840;
        --hero-2: #12122A;
        --hero-3: #2D2D50;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 50%, var(--hero-3) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: #fff;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        padding: 34px 30px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      h1 {
        font-family: "Space Grotesk", sans-serif;
        margin: 0 0 10px;
        font-size: 1.6rem;
      }

      p { margin: 0 0 18px; color: rgba(255, 255, 255, 0.75); line-height: 1.6; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        background: var(--accent);
        color: #1a1600;
        text-decoration: none;
      }

      .status {
        margin-top: 14px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.8);
        min-height: 20px;
      }
    </style>
      <link rel="stylesheet" href="assets/stability.css" />
    <script src="assets/stability.js" defer></script>
</head>
  <body>
    <div class="card">
      <h1>Betaling gelukt</h1>
      <p>We activeren nu je abonnement. Dit duurt meestal een paar seconden.</p>
      <a class="btn" href="/chat">Ga naar de chat</a>
      <div class="status" id="status"></div>
    </div>

    <script defer src="assets/vendor/supabase.min.js"></script>
    <script defer>
      (() => {
        const SUPABASE_URL = "https://mengrlsqgshxqcxhirjn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_PeVTrMXz6UaeMhkPn5Fs-Q_xfJFVRNt";

        const setStatus = (msg) => {
          const el = document.querySelector("#status");
          if (el) el.textContent = msg || "";
        };

        document.addEventListener("DOMContentLoaded", async () => {
          const params = new URLSearchParams(window.location.search);
          const paymentId = params.get("payment_id") || localStorage.getItem("mollie_payment_id");
          if (!paymentId) {
            setStatus("Geen betaalreferentie gevonden. Open de chat en probeer opnieuw.");
            return;
          }
          if (!window.supabase?.createClient) return;
          const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
          });
          const { data } = await supabase.auth.getSession();
          const accessToken = data?.session?.access_token;
          if (!accessToken) {
            window.location.href = "/login";
            return;
          }

          try {
            const resp = await fetch("/api/billing/confirm-mollie", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ payment_id: paymentId }),
            });
            const payload = await resp.json().catch(() => ({}));
            if (payload?.ok) {
              setStatus("✓ Abonnement actief.");
              return;
            }
            setStatus(payload?.error || "Abonnement nog niet actief. Ververs over 10 seconden.");
          } catch (e) {
            setStatus(e?.message || "Activeren mislukt. Ververs over 10 seconden.");
          }
        });
      })();
    </script>
  </body>
</html>
