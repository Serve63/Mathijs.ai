<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Mathijs.ai | Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --agent-yellow: #e6c200;
        --agent-text: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Plus Jakarta Sans", "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background:
          radial-gradient(900px 600px at 16% 14%, rgba(230, 194, 0, 0.2) 0%, transparent 62%),
          radial-gradient(1200px 820px at 82% 22%, rgba(59, 130, 246, 0.2) 0%, transparent 65%),
          linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
        color: var(--agent-text);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .agent-map {
        position: relative;
        width: min(980px, 92vw);
        height: min(620px, 78vh);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .agent-web {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.65;
      }

      .agent-node {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) translate(var(--x), var(--y));
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.3);
        color: #e2e8f0;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        box-shadow: 0 12px 28px -22px rgba(15, 23, 42, 0.6);
        white-space: nowrap;
      }

      .agent-node--center {
        background: rgba(15, 23, 42, 0.92);
        border: 2px solid rgba(230, 194, 0, 0.85);
        color: #fef3c7;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 14px 22px;
        box-shadow:
          0 18px 40px -28px rgba(230, 194, 0, 0.8),
          0 0 0 6px rgba(230, 194, 0, 0.08);
      }

      .agent-node--center::after {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 999px;
        border: 1px solid rgba(230, 194, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="agent-map" aria-hidden="true">
      <svg class="agent-web" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="agentLine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(226,232,240,0.35)" />
            <stop offset="100%" stop-color="rgba(230,194,0,0.45)" />
          </linearGradient>
        </defs>
        <circle cx="500" cy="300" r="230" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
        <polyline
          points="500,70 663,137 730,300 663,463 500,530 337,463 270,300 337,137 500,70"
          fill="none"
          stroke="rgba(148,163,184,0.2)"
          stroke-width="1.1"
        />
        <line x1="500" y1="300" x2="500" y2="70" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="663" y2="137" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="730" y2="300" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="663" y2="463" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="500" y2="530" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="337" y2="463" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="270" y2="300" stroke="url(#agentLine)" stroke-width="1.1" />
        <line x1="500" y1="300" x2="337" y2="137" stroke="url(#agentLine)" stroke-width="1.1" />
      </svg>
      <div class="agent-node agent-node--center" style="--x: 0px; --y: 0px;">Mathijs</div>
      <div class="agent-node" style="--x: 0px; --y: -230px;">GPT-5 mini</div>
      <div class="agent-node" style="--x: 210px; --y: -150px;">ChatGPT 5.2</div>
      <div class="agent-node" style="--x: 260px; --y: 0px;">Gemini 3</div>
      <div class="agent-node" style="--x: 210px; --y: 150px;">Grok 4</div>
      <div class="agent-node" style="--x: 0px; --y: 230px;">Opus 4.5</div>
      <div class="agent-node" style="--x: -210px; --y: 150px;">Sonnet 4.5</div>
      <div class="agent-node" style="--x: -260px; --y: 0px;">Llama 4</div>
      <div class="agent-node" style="--x: -210px; --y: -150px;">Qwen3-MAX</div>
    </div>
  </body>
</html>
