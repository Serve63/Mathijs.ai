<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Mathijs.ai | Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --agent-yellow: #e6c200;
        --agent-text: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Plus Jakarta Sans", "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background:
          radial-gradient(900px 600px at 16% 14%, rgba(230, 194, 0, 0.2) 0%, transparent 62%),
          radial-gradient(1200px 820px at 82% 22%, rgba(59, 130, 246, 0.2) 0%, transparent 65%),
          linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
        color: var(--agent-text);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .agent-stage {
        width: min(1200px, 96vw);
        height: min(720px, 86vh);
        display: grid;
        grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
        gap: 20px;
        align-items: center;
        position: relative;
      }

      .agent-panel {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 24px 50px -40px rgba(15, 23, 42, 0.8);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .agent-panel__title {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(226, 232, 240, 0.7);
      }

      .agent-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .agent-form label {
        font-size: 0.82rem;
        color: rgba(226, 232, 240, 0.7);
      }

      .agent-form textarea {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.6);
        color: #e2e8f0;
        padding: 12px 14px;
        font-size: 0.9rem;
        resize: none;
        outline: none;
        min-height: 120px;
      }

      .agent-form textarea:focus {
        border-color: rgba(230, 194, 0, 0.6);
        box-shadow: 0 0 0 3px rgba(230, 194, 0, 0.15);
      }

      .agent-form button {
        align-self: flex-start;
        border: none;
        background: linear-gradient(135deg, rgba(230, 194, 0, 0.95) 0%, rgba(255, 229, 90, 0.95) 100%);
        color: #0b1020;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.86rem;
        box-shadow: 0 16px 30px -22px rgba(230, 194, 0, 0.9);
      }

      .agent-form button:active {
        transform: translateY(1px);
      }

      .agent-map {
        position: relative;
        width: min(980px, 92vw);
        height: min(620px, 78vh);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .agent-web {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.65;
      }

      .agent-node {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) translate(var(--x), var(--y));
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.3);
        color: #e2e8f0;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        box-shadow: 0 12px 28px -22px rgba(15, 23, 42, 0.6);
        white-space: nowrap;
      }

      .agent-node--center {
        background: rgba(15, 23, 42, 0.92);
        border: 2px solid rgba(230, 194, 0, 0.85);
        color: #fef3c7;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 14px 22px;
        box-shadow:
          0 18px 40px -28px rgba(230, 194, 0, 0.8),
          0 0 0 6px rgba(230, 194, 0, 0.08);
      }

      .agent-node--center::after {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 999px;
        border: 1px solid rgba(230, 194, 0, 0.35);
      }

      .agent-inbox {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: auto;
        max-height: 440px;
        padding-right: 4px;
      }

      .agent-inbox::-webkit-scrollbar {
        width: 6px;
      }

      .agent-inbox::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.4);
        border-radius: 999px;
      }

      .agent-inbox__item {
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .agent-inbox__title {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: rgba(254, 243, 199, 0.9);
        text-transform: uppercase;
      }

      .agent-inbox__body {
        font-size: 0.88rem;
        line-height: 1.5;
        color: #e2e8f0;
      }

      .agent-panel--inbox {
        position: absolute;
        top: 0;
        right: -40px;
        width: min(320px, 28vw);
        max-width: 340px;
      }

      @media (max-width: 980px) {
        body {
          padding: 24px 0;
          overflow-y: auto;
        }

        .agent-stage {
          grid-template-columns: 1fr;
          height: auto;
        }

        .agent-map {
          width: 100%;
          height: 340px;
          order: 2;
        }

        .agent-panel {
          width: 100%;
        }

        .agent-panel--inbox {
          position: static;
          width: 100%;
          max-width: none;
          order: 3;
        }
      }
    </style>
  </head>
  <body>
    <div class="agent-stage">
      <div class="agent-panel">
        <div class="agent-panel__title">Opdracht</div>
        <form class="agent-form" id="agent-form">
          <label for="agent-input">Zet Mathijs aan het werk</label>
          <textarea id="agent-input" placeholder="Zet Mathijs aan het werk..."></textarea>
          <button type="submit" id="agent-submit">Start</button>
        </form>
      </div>

      <div class="agent-map" aria-hidden="true">
        <svg class="agent-web" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="agentLine" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="rgba(226,232,240,0.35)" />
              <stop offset="100%" stop-color="rgba(230,194,0,0.45)" />
            </linearGradient>
          </defs>
          <circle cx="500" cy="300" r="230" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="1.2" />
          <polyline
            points="500,70 663,137 730,300 663,463 500,530 337,463 270,300 337,137 500,70"
            fill="none"
            stroke="rgba(148,163,184,0.2)"
            stroke-width="1.1"
          />
          <line x1="500" y1="300" x2="500" y2="70" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="663" y2="137" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="730" y2="300" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="663" y2="463" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="500" y2="530" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="337" y2="463" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="270" y2="300" stroke="url(#agentLine)" stroke-width="1.1" />
          <line x1="500" y1="300" x2="337" y2="137" stroke="url(#agentLine)" stroke-width="1.1" />
        </svg>
        <div class="agent-node agent-node--center" style="--x: 0px; --y: 0px;">Mathijs</div>
        <div class="agent-node" style="--x: 0px; --y: -230px;">GPT-5 mini</div>
        <div class="agent-node" style="--x: 210px; --y: -150px;">ChatGPT 5.2</div>
        <div class="agent-node" style="--x: 260px; --y: 0px;">Gemini 3</div>
        <div class="agent-node" style="--x: 210px; --y: 150px;">Grok 4</div>
        <div class="agent-node" style="--x: 0px; --y: 230px;">Opus 4.5</div>
        <div class="agent-node" style="--x: -210px; --y: 150px;">Sonnet 4.5</div>
        <div class="agent-node" style="--x: -260px; --y: 0px;">Llama 4</div>
        <div class="agent-node" style="--x: -210px; --y: -150px;">Qwen3-MAX</div>
      </div>

      <div class="agent-panel agent-panel--inbox">
        <div class="agent-panel__title">Postvak</div>
        <div class="agent-inbox" id="agent-inbox">
          <div class="agent-inbox__item">
            <div class="agent-inbox__title">Wacht op opdracht</div>
            <div class="agent-inbox__body">Resultaten verschijnen hier zodra Mathijs klaar is.</div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/vendor/supabase.min.js"></script>
    <script src="auth.js"></script>
    <script>
      const form = document.getElementById("agent-form");
      const input = document.getElementById("agent-input");
      const inbox = document.getElementById("agent-inbox");
      const submitBtn = document.getElementById("agent-submit");

      const escapeHtml = (value) =>
        String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const getSupabaseClient = () => {
        if (window.mathijsSupabase) return window.mathijsSupabase;
        if (!window.supabase || !window.supabase.createClient) return null;
        const SUPABASE_URL = "https://mengrlsqgshxqcxhirjn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_PeVTrMXz6UaeMhkPn5Fs-Q_xfJFVRNt";
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
        });
        window.mathijsSupabase = client;
        return client;
      };

      const getAccessToken = async () => {
        const supabase = getSupabaseClient();
        if (!supabase) return null;
        const { data } = await supabase.auth.getSession();
        return data?.session?.access_token || null;
      };

      const apiFetchJson = async (url, { method = "POST", body } = {}) => {
        const token = await getAccessToken();
        if (!token) {
          window.location.href = "/login";
          return { ok: false, status: 401, payload: { error: "Unauthorized" } };
        }
        const resp = await fetch(url, {
          method,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const payload = await resp.json().catch(() => ({}));
        return { ok: resp.ok, status: resp.status, payload };
      };

      const runModel = async ({ provider, model, task, roleLabel }) => {
        const messages = [
          {
            role: "developer",
            content:
              `Je bent ${roleLabel}. Geef beknopte inzichten voor de opdracht. ` +
              "Antwoord in het Nederlands met maximaal 6 bullets, geen lange uitleg.",
          },
          { role: "user", content: task },
        ];
        const resp = await apiFetchJson("/api/chat", {
          method: "POST",
          body: {
            provider,
            model,
            model_key: provider === "openai" ? "chatgpt52" : "gemini3",
            model_label: provider === "openai" ? "GPT-5 mini" : "Gemini 3",
            messages,
          },
        });
        if (!resp.ok) {
          const error = resp.payload?.error || "Model call mislukt.";
          throw new Error(error);
        }
        return resp.payload?.text || "";
      };

      const buildFinalDocument = async ({ task, insights }) => {
        const provider = insights.openai ? "openai" : "gemini";
        const model = provider === "openai" ? "gpt-4o-mini" : "gemini-1.5-flash";
        const content = [
          "Opdracht:",
          task,
          "",
          "Inzichten van modellen:",
          insights.openai ? `OpenAI:\n${insights.openai}` : "",
          insights.gemini ? `Gemini:\n${insights.gemini}` : "",
        ]
          .filter(Boolean)
          .join("\n");
        const messages = [
          {
            role: "developer",
            content:
              "Je bent Mathijs (ChatGPT). Combineer alle inzichten tot één professioneel document. " +
              "Gebruik duidelijke koppen en bullets. Taal: Nederlands.",
          },
          { role: "user", content },
        ];
        const resp = await apiFetchJson("/api/chat", {
          method: "POST",
          body: {
            provider,
            model,
            model_key: provider === "openai" ? "chatgpt52" : "gemini3",
            model_label: provider === "openai" ? "GPT-5 mini" : "Gemini 3",
            messages,
          },
        });
        if (!resp.ok) {
          const error = resp.payload?.error || "Document genereren mislukt.";
          throw new Error(error);
        }
        return resp.payload?.text || "";
      };

      const insertInboxItem = (title, body) => {
        if (!inbox) return;
        const item = document.createElement("div");
        item.className = "agent-inbox__item";
        const formattedBody = escapeHtml(body).replace(/\n/g, "<br>");
        item.innerHTML = `
          <div class="agent-inbox__title">${escapeHtml(title)}</div>
          <div class="agent-inbox__body">${formattedBody}</div>
        `;
        inbox.prepend(item);
      };

      const setLoading = (isLoading) => {
        if (!submitBtn) return;
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? "Bezig..." : "Start";
      };

      if (form && input && inbox) {
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const task = input.value.trim();
          if (!task) return;
          input.value = "";
          setLoading(true);

          insertInboxItem("Mathijs is gestart", "Opdracht ontvangen. Modellen worden aangestuurd...");

          let openaiOk = false;
          let geminiOk = false;
          try {
            const status = await apiFetchJson("/api/provider-status", { method: "GET" });
            if (status.ok) {
              openaiOk = status.payload?.openai === true;
              geminiOk = status.payload?.gemini === true;
            }
          } catch {
            // ignore
          }

          const insights = { openai: null, gemini: null };
          const tasks = [];
          if (openaiOk) {
            tasks.push(
              runModel({
                provider: "openai",
                model: "gpt-4o-mini",
                task,
                roleLabel: "OpenAI specialist",
              })
                .then((text) => {
                  insights.openai = text;
                  insertInboxItem("OpenAI afgerond", "Inzichten ontvangen.");
                })
                .catch((err) => {
                  insertInboxItem("OpenAI fout", err.message || "OpenAI is niet beschikbaar.");
                })
            );
          }
          if (geminiOk) {
            tasks.push(
              runModel({
                provider: "gemini",
                model: "gemini-1.5-flash",
                task,
                roleLabel: "Gemini specialist",
              })
                .then((text) => {
                  insights.gemini = text;
                  insertInboxItem("Gemini afgerond", "Inzichten ontvangen.");
                })
                .catch((err) => {
                  insertInboxItem("Gemini fout", err.message || "Gemini is niet beschikbaar.");
                })
            );
          }
          if (tasks.length) {
            await Promise.allSettled(tasks);
          }

          if (!insights.openai && !insights.gemini) {
            insertInboxItem("Geen modellen beschikbaar", "Koppel OpenAI of Gemini om te starten.");
            setLoading(false);
            return;
          }

          try {
            const doc = await buildFinalDocument({ task, insights });
            insertInboxItem("Einddocument", doc || "Geen resultaat ontvangen.");
          } catch (err) {
            insertInboxItem("Document fout", err.message || "Kon einddocument niet maken.");
          } finally {
            setLoading(false);
          }
        });
      }
    </script>
  </body>
</html>
