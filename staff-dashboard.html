<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathijs.ai | Personeel Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #fafafa;
        --ink: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #e6c200;
        --accent-strong: #c9a900;
        --dark: #1a1a2e;
        --hero-1: #1a1a2e;
        --hero-2: #16213e;
        --hero-3: #0f3460;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 30% 20%, rgba(230, 194, 0, 0.16), transparent 45%),
          linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 48%, var(--hero-3) 100%);
        color: var(--ink);
        font-family: "Manrope", "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(230, 194, 0, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(15, 52, 96, 0.12) 0%, transparent 50%);
        pointer-events: none;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='50' cy='50' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        pointer-events: none;
        z-index: -1;
        opacity: 1;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0;
        background: rgba(12, 18, 44, 0.78);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.05) inset,
          0 4px 24px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }

      .site-header::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 0% 0%, rgba(230, 194, 0, 0.06) 0%, transparent 60%),
          radial-gradient(ellipse 80% 50% at 100% 0%, rgba(15, 52, 96, 0.06) 0%, transparent 60%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
        pointer-events: none;
        opacity: 1;
      }

      .site-header::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(230, 194, 0, 0.3) 50%,
          transparent 100%
        );
        pointer-events: none;
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        position: relative;
        z-index: 1;
        padding: 14px 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1rem;
        color: #fff;
        letter-spacing: 0.05em;
        position: relative;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 14px;
        border: 2px solid rgba(230, 194, 0, 0.4);
        box-shadow:
          0 0 0 1px rgba(230, 194, 0, 0.15),
          0 2px 12px rgba(230, 194, 0, 0.2);
      }

      .brand-text {
        font-family: "Sora", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .brand-dot {
        color: var(--accent);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 22px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Live overzicht layout */
      .live-shell {
        width: min(1400px, 100%);
        margin: 0 auto;
        padding: 18px 20px 28px;
      }

      .kpi-strip {
        background: rgba(12, 18, 44, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px 14px 0 0;
        box-shadow: 0 24px 70px -55px rgba(0, 0, 0, 0.75);
        display: grid;
        grid-template-columns: 1.1fr 1fr 1fr 1.2fr;
        overflow: hidden;
      }

      .kpi {
        padding: 16px 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.10);
        position: relative;
      }
      .kpi:last-child { border-right: none; }

      .kpi-label {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        font-weight: 700;
      }

      .kpi-value {
        font-family: "Sora", sans-serif;
        font-size: 2.1rem;
        line-height: 1.1;
        margin-top: 6px;
        color: #fff;
      }

      .kpi-sub {
        margin-top: 2px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.75);
      }

      .spark {
        position: absolute;
        right: 16px;
        top: 18px;
        width: 56px;
        height: 22px;
        opacity: 0.9;
      }

      .map-panel {
        border-radius: 0 0 14px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-top: none;
        overflow: hidden;
        background: rgba(12, 18, 44, 0.55);
        position: relative;
      }

      #world-map {
        height: min(520px, calc(100vh - 340px));
        width: 100%;
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        touch-action: auto;
        cursor: default;
        user-select: none;
        overscroll-behavior: contain;
      }

      #world-map.dragging {
        cursor: default;
      }

      .map-canvas {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
      }

      .map-error {
        min-width: 320px;
        min-height: 240px;
        display: grid;
        place-items: center;
        padding: 24px;
        color: rgba(255, 255, 255, 0.7);
        background: rgba(7, 12, 28, 0.45);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 0.95rem;
      }

      .nl-map {
        width: auto;
        height: min(480px, 60vh);
        max-width: min(720px, 90vw);
        display: block;
        pointer-events: auto;
        filter: drop-shadow(0 22px 32px rgba(6, 14, 30, 0.45));
      }

      .province {
        cursor: pointer;
      }

      .province-base {
        fill: url(#satellite);
      }

      .province-overlay {
        fill: var(--province-color, rgba(230, 194, 0, 0.35));
        fill-opacity: 0.65;
        mix-blend-mode: screen;
        pointer-events: none;
      }


      .province path {
        transition: stroke 0.2s ease, filter 0.2s ease;
      }

      .province:hover path {
        stroke: rgba(230, 194, 0, 0.95);
        stroke-width: 1.6;
        filter: drop-shadow(0 8px 14px rgba(230, 194, 0, 0.28));
      }

      .province.is-selected path {
        stroke: rgba(230, 194, 0, 1);
        stroke-width: 2;
        filter: drop-shadow(0 10px 18px rgba(230, 194, 0, 0.32));
      }

      .province:focus-visible path {
        stroke: rgba(230, 194, 0, 0.9);
        stroke-width: 2;
      }

      .legend {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 500;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(10, 14, 26, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.85rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.low { background: rgba(233, 90, 74, 0.95); box-shadow: 0 0 0 6px rgba(233, 90, 74, 0.18); }
      .dot.mid { background: rgba(242, 173, 63, 0.95); box-shadow: 0 0 0 6px rgba(242, 173, 63, 0.16); }
      .dot.high { background: rgba(56, 191, 127, 0.95); box-shadow: 0 0 0 6px rgba(56, 191, 127, 0.16); }

      .province-info {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 500;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(10, 14, 26, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.85rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .customers-panel {
        margin-top: 18px;
        background: rgba(12, 18, 44, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: 0 24px 70px -55px rgba(0, 0, 0, 0.7);
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .panel-head h2 {
        margin: 0;
        font-family: "Sora", sans-serif;
        font-size: 1.2rem;
        color: #fff;
      }

      .panel-head p {
        margin: 6px 0 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
      }

      .customers-list {
        margin-top: 16px;
        display: grid;
        gap: 12px;
      }

      .customer-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(7, 12, 28, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .customer-avatar {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: rgba(84, 162, 255, 0.22);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        font-size: 0.85rem;
      }

      .customer-name {
        margin: 0;
        font-weight: 700;
        color: #fff;
      }

      .customer-sub {
        margin: 4px 0 0;
        font-size: 0.82rem;
        color: rgba(255, 255, 255, 0.68);
      }

      .customer-amount {
        font-weight: 700;
        font-size: 1rem;
        color: #fff;
      }

      @media (max-width: 980px) {
        .header-inner {
          padding: 14px 18px;
        }
        .kpi-strip {
          grid-template-columns: 1fr 1fr;
        }
        #world-map {
          height: min(480px, calc(100vh - 320px));
        }
        .nl-map {
          height: min(360px, 55vh);
        }
        .panel-head {
          flex-direction: column;
          align-items: flex-start;
        }
        .customer-row {
          grid-template-columns: auto 1fr;
        }
        .customer-amount {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand" aria-label="Mathijs.ai startpagina">
          <img src="assets/mathijs-avatar.png" alt="Mathijs.ai-logo" class="brand-logo" width="40" height="40" />
          <span class="brand-text">MATHIJS<span class="brand-dot">.AI</span></span>
        </a>
        <div class="header-actions">
          <a class="btn secondary" href="analytics.html">Analytics</a>
          <a class="btn secondary" href="index.html">Terug</a>
        </div>
      </div>
    </header>
    <main class="live-shell" aria-label="Live overzicht">
      <section class="kpi-strip" aria-label="Kernstatistieken">
        <div class="kpi">
          <div class="kpi-label">Bezoekers nu</div>
          <div class="kpi-value" id="kpi-visitors">27</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Totaal vandaag</div>
          <div class="kpi-value" id="kpi-visits">891</div>
          <div class="kpi-sub">Bezoeken</div>
          <svg class="spark" viewBox="0 0 56 22" aria-hidden="true">
            <polyline points="0,18 10,16 20,17 30,10 40,12 56,6" fill="none" stroke="rgba(84,162,255,0.9)" stroke-width="2" />
          </svg>
        </div>
        <div class="kpi">
          <div class="kpi-label">Orders vandaag</div>
          <div class="kpi-value" id="kpi-orders">77</div>
          <div class="kpi-sub">Bestellingen</div>
          <svg class="spark" viewBox="0 0 56 22" aria-hidden="true">
            <polyline points="0,18 12,18 22,14 34,16 44,8 56,10" fill="none" stroke="rgba(84,162,255,0.9)" stroke-width="2" />
          </svg>
        </div>
        <div class="kpi">
          <div class="kpi-label">Omzet vandaag</div>
          <div class="kpi-value" id="kpi-sales">€22.282,65</div>
          <div class="kpi-sub">Omzet</div>
          <svg class="spark" viewBox="0 0 56 22" aria-hidden="true">
            <polyline points="0,18 10,12 20,14 30,9 40,11 56,7" fill="none" stroke="rgba(84,162,255,0.9)" stroke-width="2" />
          </svg>
        </div>
      </section>

      <section class="map-panel" aria-label="Kaart van Nederland">
        <div class="legend" aria-label="Legenda abonnees">
          <span class="dot low" aria-hidden="true"></span><span>Laag</span>
          <span class="dot mid" aria-hidden="true"></span><span>Midden</span>
          <span class="dot high" aria-hidden="true"></span><span>Hoog</span>
        </div>
        <div class="province-info" id="province-info" aria-live="polite">Klik op een provincie voor klantdata</div>
        <div id="world-map" role="application" aria-label="Kaart van Nederland, sleep of swipe om te verplaatsen">
          <div class="map-canvas" id="nl-map-canvas"></div>
        </div>
      </section>

      <section class="customers-panel" aria-label="Recente klanten">
        <div class="panel-head">
          <div>
            <h2>Recente klanten</h2>
            <p>Nieuwste aanmeldingen en hun laatste activiteit.</p>
          </div>
          <a class="btn secondary" href="customers.html">Open klantenbestand</a>
        </div>
        <div class="customers-list" id="recent-customers"></div>
      </section>
    </main>

    <script src="assets/customers-data.js" defer></script>
    <script src="staff-dashboard.js" defer></script>
  </body>
</html>
