<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathijs.ai | Personeel Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #fafafa;
        --ink: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #e6c200;
        --accent-strong: #c9a900;
        --dark: #1a1a2e;
        --hero-1: #1a1a2e;
        --hero-2: #16213e;
        --hero-3: #0f3460;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 30% 20%, rgba(230, 194, 0, 0.16), transparent 45%),
          linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 48%, var(--hero-3) 100%);
        color: var(--ink);
        font-family: "Manrope", "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(230, 194, 0, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(15, 52, 96, 0.12) 0%, transparent 50%);
        pointer-events: none;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='50' cy='50' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        pointer-events: none;
        z-index: -1;
        opacity: 1;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0;
        background: var(--dark);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.05) inset,
          0 4px 24px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }

      .site-header::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 0% 0%, rgba(230, 194, 0, 0.06) 0%, transparent 60%),
          radial-gradient(ellipse 80% 50% at 100% 0%, rgba(15, 52, 96, 0.06) 0%, transparent 60%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
        pointer-events: none;
        opacity: 1;
      }

      .site-header::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(230, 194, 0, 0.3) 50%,
          transparent 100%
        );
        pointer-events: none;
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        position: relative;
        z-index: 1;
        padding: 14px 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1rem;
        color: #fff;
        letter-spacing: 0.05em;
        position: relative;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 14px;
        border: 2px solid rgba(230, 194, 0, 0.4);
        box-shadow:
          0 0 0 1px rgba(230, 194, 0, 0.15),
          0 2px 12px rgba(230, 194, 0, 0.2);
      }

      .brand-text {
        font-family: "Sora", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .brand-dot {
        color: var(--accent);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 22px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Live overzicht layout */
      .live-shell {
        width: min(1400px, 100%);
        margin: 0 auto;
        padding: 18px 20px 28px;
      }

      .kpi-strip {
        background: rgba(12, 18, 44, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px 14px 0 0;
        box-shadow: 0 24px 70px -55px rgba(0, 0, 0, 0.75);
        display: grid;
        grid-template-columns: 1.1fr 1fr 1fr 1.2fr;
        overflow: hidden;
      }

      .kpi {
        padding: 16px 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.10);
        position: relative;
      }
      .kpi:last-child { border-right: none; }

      .kpi-label {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        font-weight: 700;
      }

      .kpi-value {
        font-family: "Sora", sans-serif;
        font-size: 2.1rem;
        line-height: 1.1;
        margin-top: 6px;
        color: #fff;
      }

      .kpi-sub {
        margin-top: 2px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.75);
      }

      .spark {
        position: absolute;
        right: 16px;
        top: 18px;
        width: 56px;
        height: 22px;
        opacity: 0.9;
      }

      .map-panel {
        border-radius: 0 0 14px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-top: none;
        overflow: hidden;
        background: rgba(12, 18, 44, 0.55);
        position: relative;
        width: min(70vh, 70vw, 560px);
        aspect-ratio: 1;
        margin: 24px auto 0;
      }

      #world-map {
        height: 100%;
        width: 100%;
        position: relative;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        user-select: none;
      }

      #world-map.dragging {
        cursor: grabbing;
      }

      .map-canvas {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate3d(calc(-50% + var(--pan-x, 0px)), calc(-50% + var(--pan-y, 0px)), 0);
        transition: transform 0.12s ease-out;
        will-change: transform;
      }

      #world-map.dragging .map-canvas {
        transition: none;
      }

      .nl-map {
        width: clamp(300px, 82%, 560px);
        height: auto;
        display: block;
        pointer-events: none;
        filter: drop-shadow(0 22px 32px rgba(6, 14, 30, 0.45));
      }

      .legend {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 500;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(10, 14, 26, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.85rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.visitor { background: rgba(84, 162, 255, 0.95); box-shadow: 0 0 0 6px rgba(84, 162, 255, 0.18); }
      .dot.sale { background: rgba(230, 194, 0, 0.95); box-shadow: 0 0 0 6px rgba(230, 194, 0, 0.16); }

      @media (max-width: 980px) {
        .header-inner {
          padding: 14px 18px;
        }
        .kpi-strip {
          grid-template-columns: 1fr 1fr;
        }
        .map-panel {
          width: min(90vw, 420px);
        }
        #world-map {
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="brand" aria-label="Mathijs.ai startpagina">
          <img src="assets/mathijs-avatar.png" alt="Mathijs.ai-logo" class="brand-logo" width="40" height="40" />
          <span class="brand-text">MATHIJS<span class="brand-dot">.AI</span></span>
        </a>
        <div class="header-actions">
          <a class="btn secondary" href="index.html">Terug</a>
        </div>
      </div>
    </header>
    <main class="live-shell" aria-label="Live overzicht">
      <section class="kpi-strip" aria-label="Kernstatistieken">
        <div class="kpi">
          <div class="kpi-label">Bezoekers nu</div>
          <div class="kpi-value" id="kpi-visitors">27</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Totaal vandaag</div>
          <div class="kpi-value" id="kpi-visits">891</div>
          <div class="kpi-sub">Bezoeken</div>
          <svg class="spark" viewBox="0 0 56 22" aria-hidden="true">
            <polyline points="0,18 10,16 20,17 30,10 40,12 56,6" fill="none" stroke="rgba(84,162,255,0.9)" stroke-width="2" />
          </svg>
        </div>
        <div class="kpi">
          <div class="kpi-label">Orders vandaag</div>
          <div class="kpi-value" id="kpi-orders">77</div>
          <div class="kpi-sub">Bestellingen</div>
          <svg class="spark" viewBox="0 0 56 22" aria-hidden="true">
            <polyline points="0,18 12,18 22,14 34,16 44,8 56,10" fill="none" stroke="rgba(84,162,255,0.9)" stroke-width="2" />
          </svg>
        </div>
        <div class="kpi">
          <div class="kpi-label">Omzet vandaag</div>
          <div class="kpi-value" id="kpi-sales">€22.282,65</div>
          <div class="kpi-sub">Omzet</div>
          <svg class="spark" viewBox="0 0 56 22" aria-hidden="true">
            <polyline points="0,18 10,12 20,14 30,9 40,11 56,7" fill="none" stroke="rgba(84,162,255,0.9)" stroke-width="2" />
          </svg>
        </div>
      </section>

      <section class="map-panel" aria-label="Kaart van Nederland">
        <div class="legend" aria-label="Legenda">
          <span class="dot visitor" aria-hidden="true"></span><span>Bezoeker</span>
          <span class="dot sale" aria-hidden="true"></span><span>Verkoop</span>
        </div>
        <div id="world-map" role="application" aria-label="Kaart van Nederland">
          <div class="map-canvas" id="nl-map-canvas">
            <img
              src="assets/nl-map.svg"
              alt="Kaart van Nederland met provincies"
              class="nl-map"
              draggable="false"
            />
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const elVisitors = document.getElementById("kpi-visitors");
        const elVisits = document.getElementById("kpi-visits");
        const elOrders = document.getElementById("kpi-orders");
        const elSales = document.getElementById("kpi-sales");
        const mapViewport = document.getElementById("world-map");
        const mapCanvas = document.getElementById("nl-map-canvas");

        const fmtEUR = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
        const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
        const rand = (a, b) => a + Math.random() * (b - a);
        const setupMapDrag = () => {
          if (!mapViewport || !mapCanvas) return;
          let isDragging = false;
          let startX = 0;
          let startY = 0;
          let originX = 0;
          let originY = 0;
          let panX = 0;
          let panY = 0;

          const applyPan = () => {
            mapCanvas.style.setProperty("--pan-x", `${panX}px`);
            mapCanvas.style.setProperty("--pan-y", `${panY}px`);
          };

          const startDrag = (clientX, clientY) => {
            isDragging = true;
            mapViewport.classList.add("dragging");
            startX = clientX;
            startY = clientY;
            originX = panX;
            originY = panY;
          };

          const moveDrag = (clientX, clientY) => {
            if (!isDragging) return;
            const dx = clientX - startX;
            const dy = clientY - startY;
            panX = originX + dx;
            panY = originY + dy;
            applyPan();
          };

          const endDrag = () => {
            if (!isDragging) return;
            isDragging = false;
            mapViewport.classList.remove("dragging");
          };

          if (window.PointerEvent) {
            mapViewport.addEventListener("pointerdown", (event) => {
              event.preventDefault();
              startDrag(event.clientX, event.clientY);
              mapViewport.setPointerCapture(event.pointerId);
            });

            mapViewport.addEventListener("pointermove", (event) => {
              if (!isDragging) return;
              event.preventDefault();
              moveDrag(event.clientX, event.clientY);
            });

            const stopPointer = (event) => {
              endDrag();
              if (mapViewport.hasPointerCapture(event.pointerId)) {
                mapViewport.releasePointerCapture(event.pointerId);
              }
            };

            mapViewport.addEventListener("pointerup", stopPointer);
            mapViewport.addEventListener("pointercancel", stopPointer);
            mapViewport.addEventListener("pointerleave", stopPointer);
          }

          mapViewport.addEventListener(
            "touchstart",
            (event) => {
              if (window.PointerEvent) return;
              if (!event.touches.length) return;
              event.preventDefault();
              const touch = event.touches[0];
              startDrag(touch.clientX, touch.clientY);
            },
            { passive: false }
          );

          mapViewport.addEventListener(
            "touchmove",
            (event) => {
              if (window.PointerEvent) return;
              if (!event.touches.length) return;
              event.preventDefault();
              const touch = event.touches[0];
              moveDrag(touch.clientX, touch.clientY);
            },
            { passive: false }
          );

          mapViewport.addEventListener(
            "touchend",
            () => {
              if (window.PointerEvent) return;
              endDrag();
            },
            { passive: false }
          );

          mapViewport.addEventListener(
            "touchcancel",
            () => {
              if (window.PointerEvent) return;
              endDrag();
            },
            { passive: false }
          );

          applyPan();
        };

        let visitorsNow = 27;
        let visitsToday = 891;
        let ordersToday = 77;
        let salesToday = 22282.65;

        const tick = () => {
          // visitors fluctuate
          visitorsNow = clamp(Math.round(visitorsNow + rand(-4, 6)), 8, 120);
          elVisitors.textContent = String(visitorsNow);

          const saleChance = Math.random();
          if (saleChance > 0.55) {
            ordersToday += 1;
            salesToday += rand(29, 240);
          }

          visitsToday += clamp(Math.round(rand(1, 5)), 1, 8);

          elVisits.textContent = String(visitsToday);
          elOrders.textContent = String(ordersToday);
          elSales.textContent = fmtEUR.format(salesToday);
        };

        setupMapDrag();
        tick();
        setInterval(tick, 1800);
      })();
    </script>
  </body>
</html>
