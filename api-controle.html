<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Mathijs.ai | API controle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #fafafa;
        --ink: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #e6c200;
        --accent-strong: #c9a900;
        --dark: #1a1a2e;
        --hero-1: #1a1a2e;
        --hero-2: #16213e;
        --hero-3: #0f3460;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 30% 20%, rgba(230, 194, 0, 0.16), transparent 45%),
          linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 48%, var(--hero-3) 100%);
        color: var(--ink);
        font-family: "Manrope", "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(230, 194, 0, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(15, 52, 96, 0.12) 0%, transparent 50%);
        pointer-events: none;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='50' cy='50' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        pointer-events: none;
        z-index: -1;
        opacity: 1;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0;
        background: var(--dark);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.05) inset,
          0 4px 24px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        position: relative;
        z-index: 1;
        padding: 14px 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1rem;
        color: #fff;
        letter-spacing: 0.05em;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 14px;
        border: 2px solid rgba(230, 194, 0, 0.4);
        box-shadow:
          0 0 0 1px rgba(230, 194, 0, 0.15),
          0 2px 12px rgba(230, 194, 0, 0.2);
      }

      .brand-text {
        font-family: "Sora", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .brand-dot {
        color: var(--accent);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 22px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 20px 32px;
        display: grid;
        gap: 18px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .summary-card {
        padding: 16px 18px;
        border-radius: 14px;
        background: rgba(12, 18, 44, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 70px -55px rgba(0, 0, 0, 0.75);
      }

      .summary-label {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 700;
      }

      .summary-value {
        font-family: "Sora", sans-serif;
        font-size: 1.8rem;
        margin-top: 6px;
        color: #fff;
      }

      .summary-sub {
        margin-top: 2px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.65);
      }

      .panel {
        background: rgba(12, 18, 44, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 16px 18px 18px;
        box-shadow: 0 24px 70px -55px rgba(0, 0, 0, 0.7);
      }

      .panel-head h1 {
        margin: 0;
        font-family: "Sora", sans-serif;
        font-size: 1.35rem;
        color: #fff;
      }

      .panel-head p {
        margin: 6px 0 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
      }

      .table-head,
      .table-row {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr 0.8fr 0.8fr 0.8fr;
        gap: 12px;
        align-items: center;
      }

      .table-head {
        margin-top: 16px;
        padding-bottom: 10px;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table-row {
        padding: 12px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .table-row:last-child {
        border-bottom: none;
      }

      .cell {
        font-size: 0.92rem;
        color: rgba(255, 255, 255, 0.85);
      }

      .muted {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.85rem;
      }

      .empty {
        padding: 16px 0 4px;
        color: rgba(255, 255, 255, 0.65);
      }

      @media (max-width: 900px) {
        .header-inner { padding: 14px 18px; }
        .summary-grid { grid-template-columns: 1fr; }
        .table-head { display: none; }
        .table-row { grid-template-columns: 1fr; gap: 10px; }
        .cell::before {
          content: attr(data-label);
          display: block;
          font-size: 0.72rem;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: rgba(255, 255, 255, 0.55);
          margin-bottom: 4px;
        }
      }
    </style>
    <link rel="stylesheet" href="assets/stability.css" />
    <link rel="stylesheet" href="assets/ui.css" />
    <script src="assets/stability.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="brand" aria-label="Mathijs.ai startpagina">
          <img src="assets/logo.png" alt="Mathijs.ai-logo" class="brand-logo" width="40" height="40" />
          <span class="brand-text">MATHIJS<span class="brand-dot">.AI</span></span>
        </a>
        <div class="header-actions">
          <a class="btn secondary" href="/staff-dashboard">Terug naar dashboard</a>
        </div>
      </div>
    </header>

    <main class="shell" aria-label="API controle">
      <section class="summary-grid" aria-label="API kosten deze maand">
        <div class="summary-card">
          <div class="summary-label">API kosten deze maand</div>
          <div class="summary-value" id="api-month-spend">€ 0,00</div>
          <div class="summary-sub" id="api-month-chats">0 chats</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Maandlimiet</div>
          <div class="summary-value" id="api-month-limit">-</div>
          <div class="summary-sub" id="api-month-remaining">-</div>
        </div>
      </section>

      <section class="panel" aria-label="API kosten per model">
        <div class="panel-head">
          <h1>API controle</h1>
          <p>Overzicht van kosten per model voor deze maand.</p>
        </div>
        <div class="table-head" aria-hidden="true">
          <div>Model</div>
          <div>Provider</div>
          <div>Chats</div>
          <div>Tokens</div>
          <div>Kosten</div>
        </div>
        <div id="api-usage-table"></div>
        <div class="empty" id="api-usage-empty" hidden>Geen usage data voor deze maand.</div>
        <div class="muted" id="api-usage-note"></div>
      </section>
    </main>

    <script src="assets/vendor/supabase.min.js" defer></script>
    <script src="assets/ui.js" defer></script>
    <script src="api-controle.js" defer></script>
  </body>
</html>
