<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathijs.ai | Cursusbeheer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #e6c200;
        --accent-strong: #c9a900;
        --dark: #1a1a2e;
        --hero-1: #1a1a2e;
        --hero-2: #16213e;
        --hero-3: #0f3460;
        --panel: rgba(12, 18, 44, 0.78);
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 30% 20%, rgba(230, 194, 0, 0.16), transparent 45%),
          linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 48%, var(--hero-3) 100%);
        color: var(--ink);
        font-family: "Manrope", "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0;
        background: rgba(12, 18, 44, 0.78);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1rem;
        color: #fff;
        letter-spacing: 0.05em;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 14px;
        border: 2px solid rgba(230, 194, 0, 0.4);
        box-shadow:
          0 0 0 1px rgba(230, 194, 0, 0.15),
          0 2px 12px rgba(230, 194, 0, 0.2);
      }

      .brand-text {
        font-family: "Sora", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .brand-dot {
        color: var(--accent);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 10px 22px;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        border-radius: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn.primary {
        background: var(--accent);
        color: #1a1600;
        border-color: rgba(230, 194, 0, 0.5);
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 40px;
        display: grid;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 24px 70px -55px rgba(0, 0, 0, 0.75);
        padding: 20px 22px;
      }

      .panel h1,
      .panel h2 {
        margin: 0 0 8px;
        font-family: "Sora", sans-serif;
        letter-spacing: -0.02em;
      }

      .panel p {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid.two {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.82);
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.4);
        color: #fff;
        font-size: 0.95rem;
        font-family: inherit;
      }

      textarea {
        min-height: 100px;
        resize: vertical;
      }

      .row {
        display: grid;
        gap: 8px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .lesson-list {
        display: grid;
        gap: 12px;
      }

      .lesson-item {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 12px 14px;
        display: grid;
        gap: 10px;
      }

      .lesson-meta {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-size: 0.75rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="staff-dashboard.html" class="brand" aria-label="Terug naar staff dashboard">
          <img src="assets/mathijs-avatar.png" alt="Mathijs.ai logo" class="brand-logo" width="40" height="40" />
          <span class="brand-text">MATHIJS<span class="brand-dot">.AI</span></span>
        </a>
        <div class="header-actions">
          <a class="btn secondary" href="analytics.html">Analytics</a>
          <a class="btn secondary" href="boekhouding.html">Boekhouding</a>
          <a class="btn secondary" href="course.html">Cursus (live)</a>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="panel">
        <h1>Cursusbeheer</h1>
        <p>Beheer hier de inhoud van de cursus: titels, video’s, duur en categorieën.</p>
      </section>

      <section class="panel grid two" aria-label="Cursus metadata">
        <div class="row">
          <label for="course-title">Cursustitel</label>
          <input id="course-title" type="text" value="Word een AI-Expert in 50 Lessen" />
        </div>
        <div class="row">
          <label for="course-level">Niveau</label>
          <input id="course-level" type="text" value="Pro" />
        </div>
        <div class="row">
          <label for="course-lessons">Aantal lessen</label>
          <input id="course-lessons" type="number" value="50" />
        </div>
        <div class="row">
          <label for="course-hours">Uur content</label>
          <input id="course-hours" type="text" value="10+" />
        </div>
        <div class="row">
          <label for="course-description">Beschrijving</label>
          <textarea id="course-description">Van strategie tot implementatie. Leer alles over governance, automatisering en adoptie.</textarea>
        </div>
      </section>

      <section class="panel" aria-label="Categorieën">
        <h2>Categorieën</h2>
        <div class="actions">
          <span class="chip">Strategie</span>
          <span class="chip">Governance</span>
          <span class="chip">Automatisering</span>
          <button class="btn secondary" type="button">+ Categorie toevoegen</button>
        </div>
      </section>

      <section class="panel" aria-label="Lessen">
        <h2>Lessen</h2>
        <div class="lesson-list">
          <div class="lesson-item">
            <div class="lesson-meta">
              <div class="row">
                <label>Titel</label>
                <input type="text" value="AI les 1" />
              </div>
              <div class="row">
                <label>Duur</label>
                <input type="text" value="12 min" />
              </div>
              <div class="row">
                <label>Niveau</label>
                <input type="text" value="Pro" />
              </div>
              <div class="row">
                <label>Video-URL</label>
                <input type="url" value="https://..." />
              </div>
            </div>
            <div class="actions">
              <button class="btn secondary" type="button">Vervang video</button>
              <button class="btn secondary" type="button">Verwijder les</button>
            </div>
          </div>

          <div class="lesson-item">
            <div class="lesson-meta">
              <div class="row">
                <label>Titel</label>
                <input type="text" value="AI les 2" />
              </div>
              <div class="row">
                <label>Duur</label>
                <input type="text" value="12 min" />
              </div>
              <div class="row">
                <label>Niveau</label>
                <input type="text" value="Pro" />
              </div>
              <div class="row">
                <label>Video-URL</label>
                <input type="url" value="https://..." />
              </div>
            </div>
            <div class="actions">
              <button class="btn secondary" type="button">Vervang video</button>
              <button class="btn secondary" type="button">Verwijder les</button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn secondary" type="button">+ Les toevoegen</button>
          <button class="btn primary" type="button">Wijzigingen opslaan</button>
        </div>
      </section>
    </main>
  </body>
</html>
