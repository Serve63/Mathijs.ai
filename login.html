<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathijs.ai | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand" aria-label="Mathijs dot AI">
          <img class="auth-avatar" src="assets/mathijs-avatar.png" alt="Mathijs.ai logo" />
          <div class="auth-brand-text">
            <span class="auth-brand-word">MATHIJS</span>
            <span class="auth-brand-dot">.AI</span>
          </div>
        </div>
        <div class="auth-headline">
          <p class="eyebrow">Welkom terug</p>
          <h1>Log in op Mathijs.ai</h1>
          <p class="auth-sub">
            Gebruik je zakelijk e-mailadres en wachtwoord om toegang te krijgen tot het platform.
          </p>
        </div>
        <form id="login-form" class="auth-form" novalidate>
          <label for="login-email">Zakelijk e-mail</label>
          <input id="login-email" name="email" type="email" placeholder="naam@bedrijf.com" required />

          <label for="login-password">Wachtwoord</label>
          <input
            id="login-password"
            name="password"
            type="password"
            placeholder="********"
            required
            minlength="6"
          />

          <button type="submit" id="login-button" class="btn primary full-width">Inloggen</button>
        </form>
        <p class="form-feedback" id="login-feedback" aria-live="polite"></p>
        <div class="auth-meta">
          <a href="#">Wachtwoord vergeten?</a>
          <a href="signup.html">Aanvragen voor toegang</a>
        </div>
      </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script defer src="auth.js"></script>
  </body>
</html>
