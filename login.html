<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Mathijs.ai | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #F5C518;
        --accent-dark: #D4A915;
        --hero-1: #0D1840;
        --hero-2: #12122A;
        --hero-3: #2D2D50;
        --fg: #1a1a1f;
        --fg-muted: #6b6b76;
        --border: rgba(0, 0, 0, 0.08);
        --error: #dc3545;
        --success: #28a745;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 50%, var(--hero-3) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          radial-gradient(ellipse 80% 50% at 20% 30%, rgba(245, 197, 24, 0.1) 0%, transparent 50%),
          radial-gradient(ellipse 60% 40% at 85% 70%, rgba(245, 197, 24, 0.08) 0%, transparent 50%);
        pointer-events: none;
      }

      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        pointer-events: none;
        opacity: 0.5;
      }

      .auth-container {
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 1;
      }

      .auth-card {
        background: #fff;
        border-radius: 24px;
        padding: 48px 40px;
        box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.4);
        position: relative;
      }

      .auth-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 32px;
      }

      .auth-headline {
        text-align: center;
        margin-bottom: 32px;
      }

      .auth-eyebrow {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        margin: 0 0 12px;
      }

      .auth-headline h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        margin: 0 0 12px;
        color: var(--fg);
      }

      .auth-subtitle {
        font-size: 0.95rem;
        color: var(--fg-muted);
        margin: 0;
        line-height: 1.5;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .auth-form label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--fg);
      }

      .auth-form input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--fg);
        background: #fafafa;
        transition: all 0.2s ease;
      }

      .auth-form input::placeholder {
        color: #a0a0a8;
      }

      .auth-form input:focus {
        outline: none;
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(245, 197, 24, 0.15);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
        width: 100%;
      }

      .btn.primary {
        background: var(--accent);
        color: #1a1600;
      }

      .btn.primary:hover {
        background: var(--accent-dark);
        transform: translateY(-2px);
      }

      .btn.primary:active {
        transform: translateY(0);
      }

      .form-feedback {
        min-height: 20px;
        font-size: 0.85rem;
        text-align: center;
        margin: 8px 0 0;
      }

      .form-feedback.error {
        color: var(--error);
      }

      .form-feedback.success {
        color: var(--success);
      }

      .auth-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .auth-meta a {
        font-size: 0.85rem;
        color: var(--fg-muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .auth-pane[hidden] {
        display: none;
      }

      .link-btn {
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        cursor: pointer;
        color: var(--fg-muted);
        font-size: 0.85rem;
        transition: color 0.2s ease;
      }

      .auth-meta a:hover {
        color: var(--accent);
      }

      .link-btn:hover {
        color: var(--accent);
      }

      .back-arrow {
        position: absolute;
        top: 18px;
        left: 18px;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: var(--hero-3);
        background: transparent;
        border: 1px solid transparent;
        text-decoration: none;
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .back-arrow:hover {
        color: #0b2a4d;
        transform: translateY(-0.5px);
      }

      .back-arrow:active {
        transform: translateY(0);
      }

      .back-arrow:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(45, 45, 80, 0.22);
      }

      .back-arrow svg {
        width: 28px;
        height: 28px;
      }

      @media (max-width: 480px) {
        body {
          padding: 60px 16px 40px;
        }

        .auth-card {
          padding: 36px 24px;
        }

        .auth-meta {
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
      }
    </style>
      <link rel="stylesheet" href="assets/stability.css" />
    <script src="assets/stability.js" defer></script>
</head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <a href="/" class="back-arrow" aria-label="Terug naar home" title="Terug naar home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 8l-4 4 4 4" />
            <path d="M6 12h10" />
          </svg>
        </a>
        <div class="auth-brand" aria-label="Mathijs dot AI">
        </div>
        <div class="auth-headline">
          <p class="auth-eyebrow" id="auth-eyebrow">Welkom terug</p>
          <h1 id="auth-title">Log in op Mathijs.ai</h1>
          <p class="auth-subtitle" id="auth-subtitle" hidden></p>
        </div>
        <div class="auth-pane" id="login-pane">
          <form id="login-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="login-email">E-mail</label>
              <input id="login-email" name="email" type="email" placeholder="naam@bedrijf.com" required />
            </div>

            <div class="form-group">
              <label for="login-password">Wachtwoord</label>
              <input
                id="login-password"
                name="password"
                type="password"
                placeholder="••••••••"
                required
                minlength="6"
              />
            </div>

            <button type="submit" id="login-button" class="btn primary">Inloggen</button>
          </form>
          <p class="form-feedback" id="login-feedback" aria-live="polite"></p>
          <div class="auth-meta">
            <button type="button" class="link-btn" id="forgot-link">Wachtwoord vergeten?</button>
          </div>
        </div>

        <div class="auth-pane" id="reset-request-pane" hidden>
          <form id="reset-request-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="reset-email">E-mail</label>
              <input id="reset-email" name="email" type="email" placeholder="naam@bedrijf.com" required />
            </div>
            <button type="submit" id="reset-request-button" class="btn primary">Reset link sturen</button>
          </form>
          <p class="form-feedback" id="reset-request-feedback" aria-live="polite"></p>
          <div class="auth-meta">
            <button type="button" class="link-btn" id="back-to-login-request">Terug naar inloggen</button>
          </div>
        </div>

        <div class="auth-pane" id="reset-pane" hidden>
          <form id="reset-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="reset-password">Nieuw wachtwoord</label>
              <input
                id="reset-password"
                name="password"
                type="password"
                placeholder="Minimaal 10 tekens"
                minlength="10"
                required
              />
            </div>
            <div class="form-group">
              <label for="reset-confirm">Bevestig wachtwoord</label>
              <input
                id="reset-confirm"
                name="confirm"
                type="password"
                placeholder="Herhaal wachtwoord"
                minlength="10"
                required
              />
            </div>
            <button type="submit" id="reset-save-button" class="btn primary">Wachtwoord opslaan</button>
          </form>
          <p class="form-feedback" id="reset-feedback" aria-live="polite"></p>
          <div class="auth-meta">
            <button type="button" class="link-btn" id="back-to-login-reset">Terug naar inloggen</button>
          </div>
        </div>
      </div>
    </div>
    <script defer src="assets/vendor/supabase.min.js"></script>
    <script defer src="auth.js"></script>
  </body>
</html>
